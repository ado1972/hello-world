<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SFG CRM</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --accent: #6366f1;
      --accent2: #22d3ee;
      --text: #e2e8f0;
      --muted: #64748b;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
      --orange: #f97316;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Nav ── */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 32px;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: color .15s;
    }
    nav a:hover, nav a.active { color: var(--text); }

    /* ── Layout ── */
    .page { max-width: 1280px; margin: 0 auto; padding: 32px 24px; }

    /* ── Stats row ── */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
    }
    .stat-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }
    .stat-card .value { font-size: 30px; font-weight: 700; }
    .stat-card.accent .value { color: var(--accent2); }

    /* ── Scrape form ── */
    .scrape-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 32px;
    }
    .scrape-box h2 { font-size: 15px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .row input, .row textarea, .row select {
      flex: 1;
      min-width: 220px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 9px 12px;
      font-size: 13px;
      outline: none;
      transition: border-color .15s;
    }
    .row input:focus, .row textarea:focus { border-color: var(--accent); }
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 9px 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
      white-space: nowrap;
    }
    .btn:hover { opacity: .88; }
    .btn.secondary { background: var(--border); color: var(--text); }
    .btn.danger { background: var(--red); }

    /* ── Flash messages ── */
    .flash { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; }
    .flash.success { background: #14532d55; border: 1px solid var(--green); color: var(--green); }
    .flash.error   { background: #7f1d1d55; border: 1px solid var(--red);   color: var(--red); }
    .flash.info    { background: #1e3a5f55; border: 1px solid var(--accent2); color: var(--accent2); }

    /* ── Filters ── */
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--muted);
      padding: 5px 14px;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: all .15s;
    }
    .filter-btn:hover { color: var(--text); border-color: var(--accent); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── Table ── */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      background: #1e2130;
      text-align: left;
      padding: 12px 16px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      font-weight: 600;
      border-bottom: 1px solid var(--border);
    }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #ffffff08; }
    td { padding: 12px 16px; vertical-align: top; }

    .company { font-weight: 600; color: var(--text); }
    .company a { color: inherit; text-decoration: none; }
    .company a:hover { color: var(--accent2); }
    .mono { font-family: monospace; font-size: 12px; color: var(--muted); }
    .desc { color: var(--muted); font-size: 12px; max-width: 260px; line-height: 1.5; }

    /* ── Status badges ── */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .badge-new       { background: #1e3a5f; color: var(--accent2); }
    .badge-contacted { background: #3b2f00; color: var(--yellow); }
    .badge-qualified { background: #14532d; color: var(--green); }
    .badge-closed    { background: #1a4731; color: #4ade80; }
    .badge-rejected  { background: #450a0a; color: var(--red); }

    /* ── Tags ── */
    .tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .tag {
      background: #2a2d3a;
      color: var(--muted);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 11px;
    }

    /* ── Inline status update ── */
    select.status-select {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 12px;
      padding: 3px 6px;
      cursor: pointer;
    }

    /* ── Empty state ── */
    .empty { text-align: center; padding: 64px 24px; color: var(--muted); }
    .empty .icon { font-size: 48px; margin-bottom: 16px; }

    /* ── Log stream ── */
    #log {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.7;
      max-height: 360px;
      overflow-y: auto;
      margin-top: 16px;
      display: none;
      color: #a0aec0;
      white-space: pre-wrap;
    }
    #log.active { display: block; }
    .log-ok    { color: var(--green); }
    .log-info  { color: var(--accent2); }
    .log-done  { color: var(--accent); font-weight: bold; }

    /* ── Detail panel ── */
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .detail-field label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }
    .detail-field p { color: var(--text); }
    .detail-field a { color: var(--accent2); }
  </style>
</head>
<body>

<nav>
  <span class="logo">⚡ SFG CRM</span>
  <a href="/" class="{{ 'active' if request.path == '/' else '' }}">Dashboard</a>
  <a href="/leads" class="{{ 'active' if request.path.startswith('/leads') else '' }}">Leads</a>
  <a href="/scrape" class="{{ 'active' if request.path == '/scrape' else '' }}">Scrape</a>
</nav>

<div class="page">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash {{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

</body>
</html>
